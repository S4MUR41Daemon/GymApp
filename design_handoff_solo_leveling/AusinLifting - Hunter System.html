  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #06080f;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #particle-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }
    #root {
      position: relative; z-index: 1;
      display: flex; justify-content: center;
      height: 100%;
    }
    .phone {
      width: min(390px, 100vw);
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(175deg, #07101e 0%, #06080f 60%);
      border-left: 1px solid rgba(59,130,246,0.08);
      border-right: 1px solid rgba(59,130,246,0.08);
      overflow: hidden;
      position: relative;
    }
    /* scanlines */
    .phone::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
      pointer-events: none; z-index: 50;
    }
    /* scroll area */
    .screen-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px;
    }
    .screen-scroll::-webkit-scrollbar { width: 2px; }
    .screen-scroll::-webkit-scrollbar-track { background: transparent; }
    .screen-scroll::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.25); border-radius: 1px; }

    /* XP bar */
    .xp-track {

    .xp-fill {

      position: relative; transition: width 1.2s cubic-bezier(.25,.8,.25,1);
    }
    .xp-fill::after {

    /* Tab nav */

      background: rgba(59,130,246,0.2);

<body>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── TWEAK DEFAULTS ──────────────────────────────────────── */

/* ── DATA ────────────────────────────────────────────────── */
const RANKS_CFG = {
  E: { color: '#94a3b8', glow: 'rgba(148,163,184,0.5)', glow2: 'rgba(148,163,184,0.15)' },
  D: { color: '#22c55e', glow: 'rgba(34,197,94,0.5)',   glow2: 'rgba(34,197,94,0.15)' },

};

const DAILY_QUESTS = [

  { id:5, title:'Completar Semana 2 del bloque', reward:800, done:false, prog:1, total:2 },

const GUILD_MEMBERS = [
  { name:'Daemon',  level:23, rank:'C', role:'Líder',   streak:14 },

};

/* ── PARTICLES ────────────────────────────────────────────── */
function startParticles(density) {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return () => {};
  const ctx = canvas.getContext('2d');
  let animId;
  const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
  resize();
  window.addEventListener('resize', resize);
  const pts = Array.from({length: density}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.4 + 0.3,
    vy: -(Math.random() * 0.25 + 0.08),
    vx: (Math.random() - 0.5) * 0.15,
    op: Math.random() * 0.45 + 0.1,
    opDir: Math.random() > 0.5 ? 1 : -1,
    cyan: Math.random() > 0.65,
  }));
  const draw = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pts.forEach(p => {
      const col = p.cyan ? '#22d3ee' : '#3b82f6';
      const alpha = Math.floor(p.op * 255).toString(16).padStart(2,'0');
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = col + alpha; ctx.fill();
      const grd = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      grd.addColorStop(0, col+'33'); grd.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*5, 0, Math.PI*2);
      ctx.fillStyle = grd; ctx.fill();
      p.y += p.vy; p.x += p.vx;
      p.op += p.opDir * 0.004;
      if (p.op > 0.55) p.opDir = -1;
      if (p.op < 0.06) p.opDir = 1;
      if (p.y < -10) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    });
    animId = requestAnimationFrame(draw);
  };
  draw();
  return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); };
}

/* ── SHARED COMPONENTS ───────────────────────────────────── */
const RankBadge = ({ rank, size='md' }) => {
  const r = RANKS_CFG[rank] || RANKS_CFG.E;
  const sz = size==='sm' ? 22 : size==='lg' ? 44 : size==='xl' ? 64 : 28;
  const fs = size==='sm' ? 11 : size==='lg' ? 22 : size==='xl' ? 32 : 14;
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', justifyContent:'center',
      width:sz, height:sz, borderRadius:sz*0.18,
      border:`1.5px solid ${r.color}`,
      color:r.color, fontSize:fs, flexShrink:0,
      background:`${r.color}10`,
      '--rg': r.glow, '--rg2': r.glow2, '--ri': `${r.color}20`,
      animation:'rankGlow 2.5s ease-in-out infinite',
      fontFamily:"'Rajdhani', sans-serif", fontWeight:700,
    }}>{rank}</span>
  );
};

const SysLabel = ({children}) => (

);

      <div style={{display:'flex', justifyContent:'space-between', marginTop:5}}>
        <span style={{fontSize:10, color:'rgba(96,165,250,0.6)', fontFamily:"'Barlow Condensed',sans-serif", letterSpacing:'0.06em'}}>
          XP {current.toLocaleString()} / {max.toLocaleString()}
        </span>
        <span style={{fontSize:10, color:'rgba(96,165,250,0.6)', fontFamily:"'Barlow Condensed',sans-serif"}}>{pct}%</span>
      </div>
    </div>
  );
};

const Divider = ({style}) => (

);

/* ── LEVEL UP MODAL ───────────────────────────────────────── */
const LevelUpModal = ({newLevel, rank, onClose}) => (

    <div className="lvl-box" onClick={e=>e.stopPropagation()}>

      {/* Portal ring */}
      <div style={{width:80, height:80, borderRadius:'50%', border:'2px solid rgba(59,130,246,0.3)', margin:'0 auto 20px', position:'relative', display:'flex', alignItems:'center', justifyContent:'center'}}>
        <div style={{position:'absolute', inset:4, borderRadius:'50%', border:'1px solid rgba(59,130,246,0.2)', animation:'portalSpin 3s linear infinite'}} />
        <div style={{position:'absolute', inset:-6, borderRadius:'50%', border:'1px dashed rgba(59,130,246,0.15)', animation:'portalSpin 8s linear infinite reverse'}} />

      <SysLabel>— SYSTEM NOTIFICATION —</SysLabel>
      <div className="lvl-big" style={{margin:'10px 0 4px'}}>LEVEL UP</div>
      <div style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:28, color:'#93c5fd', letterSpacing:'0.08em', marginBottom:20}}>
        LEVEL {newLevel}
      </div>
      <div style={{fontSize:12, color:'rgba(148,163,184,0.7)', marginBottom:8, lineHeight:1.6}}>
        Has alcanzado el nivel <span style={{color:'#60a5fa', fontWeight:600}}>{newLevel}</span>.<br/>
        Tu fuerza continúa creciendo, Hunter.
      </div>
      <div style={{display:'flex', alignItems:'center', gap:8, justifyContent:'center', marginBottom:24}}>
        <span style={{fontSize:11, color:'rgba(251,191,36,0.8)', fontWeight:600}}>✦ Nuevo título desbloqueado:</span>
        <span className="title-badge">Iron Warrior</span>
      </div>
      <button className="glow-btn" onClick={onClose}>CONTINUAR</button>
    </div>
  </div>
);

/* ── TOP BAR ──────────────────────────────────────────────── */
const TopBar = ({hunter, rank, onTriggerLevelUp}) => (
  <div style={{padding:'12px 16px 10px', borderBottom:'1px solid rgba(59,130,246,0.07)', flexShrink:0}}>
    <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>

/* ── TRAINING SCREEN ──────────────────────────────────────── */
const TrainingScreen = () => {
  const [sets, setSets] = useState(
    BLOCK.exercises.reduce((acc, ex) => {
      acc[ex.id] = ex.sets.map(s => ({...s, done:false}));
      return acc;
    }, {})
  );
  const [open, setOpen] = useState({1:true, 2:false, 3:false});
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(true);
  const [xpFlash, setXpFlash] = useState(null);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setSeconds(s => s+1), 1000);
    return () => clearInterval(id);
  }, [running]);

  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  const toggleSet = (exId, setIdx) => {
    setSets(prev => {
      const ex = [...prev[exId]];
      const wasDone = ex[setIdx].done;
      ex[setIdx] = {...ex[setIdx], done: !wasDone};
      if (!wasDone) setXpFlash('+30 XP');
      return {...prev, [exId]: ex};
    });
    if (!sets[exId][setIdx].done) setTimeout(() => setXpFlash(null), 1200);
  };

  const totalSets = BLOCK.exercises.reduce((a,ex) => a+ex.sets.length, 0);
  const doneSets  = Object.values(sets).flat().filter(s=>s.done).length;

  return (
    <div className="screen-scroll slide-up">
      {/* Header */}
      <div style={{marginBottom:14}}>
        <SysLabel>— ENTRENAMIENTO EN CURSO —</SysLabel>
        <div style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:18, color:'#e2e8f0', marginTop:4, letterSpacing:'0.03em'}}>{BLOCK.workoutName}</div>
      </div>

      {/* Timer + progress */}
      <div className="sl-card" style={{marginBottom:14, display:'flex', alignItems:'center', gap:16}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:32, color:'#60a5fa', letterSpacing:'0.06em', cursor:'pointer'}} onClick={()=>setRunning(r=>!r)}>
            {fmt(seconds)}
          </div>
          <div style={{fontSize:9, color:'rgba(96,165,250,0.5)', letterSpacing:'0.12em', fontFamily:"'Barlow Condensed',sans-serif"}}>
            {running ? '▶ RUNNING' : '⏸ PAUSED'}
          </div>
        </div>
        <div style={{flex:1}}>
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:6}}>
            <span style={{fontSize:11, color:'rgba(148,163,184,0.6)'}}>Series completadas</span>
            <span style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:14, color:'#60a5fa'}}>{doneSets}/{totalSets}</span>
          </div>
          <div className="prog-track">
            <div className="prog-fill" style={{width:`${(doneSets/totalSets)*100}%`}} />
          </div>
        </div>
        {/* XP flash */}
        {xpFlash && (
          <div style={{position:'absolute', right:24, top:100, color:'#34d399', fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:18, animation:'xpGain 1.1s ease forwards', pointerEvents:'none'}}>
            {xpFlash}
          </div>
        )}
      </div>

      {/* Exercises */}
      <div style={{display:'flex', flexDirection:'column', gap:10, marginBottom:14}}>
        {BLOCK.exercises.map(ex => {
          const exSets = sets[ex.id];
          const exDone = exSets.filter(s=>s.done).length;
          const isOpen = open[ex.id];
          return (
            <div key={ex.id} className="sl-card" style={{padding:'0'}}>
              {/* Exercise header */}
              <button style={{width:'100%', background:'none', border:'none', cursor:'pointer', padding:'12px 16px', display:'flex', alignItems:'center', gap:10}} onClick={()=>setOpen(o=>({...o,[ex.id]:!o[ex.id]}))}>
                <div style={{width:6, height:6, borderRadius:'50%', background:exDone===exSets.length?'#22c55e':'#3b82f6', boxShadow:`0 0 6px ${exDone===exSets.length?'#22c55e':'#3b82f6'}`, flexShrink:0}} />
                <span style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:600, fontSize:15, color:'#e2e8f0', flex:1, textAlign:'left', letterSpacing:'0.03em'}}>{ex.name}</span>
                <span style={{fontSize:11, color:'rgba(96,165,250,0.6)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:600}}>{exDone}/{exSets.length}</span>
                <span style={{color:'rgba(96,165,250,0.4)', fontSize:13, marginLeft:4, transform:isOpen?'rotate(90deg)':'rotate(0)', transition:'transform 0.2s'}}>›</span>
              </button>
              {/* Sets */}
              {isOpen && (
                <div style={{padding:'0 16px 12px', display:'flex', flexDirection:'column', gap:8}}>
                  <div style={{display:'grid', gridTemplateColumns:'24px 1fr 48px 48px', gap:8, alignItems:'center', marginBottom:2}}>
                    {['','SERIE','KG','REPS'].map((h,i) => (
                      <span key={i} style={{fontSize:9, color:'rgba(96,165,250,0.4)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:600, letterSpacing:'0.1em', textAlign:i>0?'center':'left'}}>{h}</span>
                    ))}
                  </div>
                  {exSets.map((s,idx) => (
                    <div key={idx} style={{display:'grid', gridTemplateColumns:'24px 1fr 48px 48px', gap:8, alignItems:'center'}}>
                      <button className={`set-ck ${s.done?'ck-done':''}`} onClick={()=>toggleSet(ex.id,idx)}>
                        {s.done ? '✓' : ''}
                      </button>
                      <span style={{fontSize:12, color:'rgba(148,163,184,0.7)', textAlign:'center', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:600}}>#{s.n}</span>
                      <span style={{fontSize:13, color:s.done?'rgba(148,163,184,0.4)':'#e2e8f0', textAlign:'center', fontFamily:"'Rajdhani',sans-serif", fontWeight:600}}>{s.kg}</span>
                      <span style={{fontSize:13, color:s.done?'rgba(148,163,184,0.4)':'#e2e8f0', textAlign:'center', fontFamily:"'Rajdhani',sans-serif", fontWeight:600}}>×{s.reps}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <button className="glow-btn" style={{background:'rgba(34,197,94,0.1)', borderColor:'rgba(34,197,94,0.3)', color:'#86efac'}}>
        ✦ COMPLETAR ENTRENAMIENTO
      </button>
      <div style={{height:16}} />
    </div>
  );
};

/* ── GUILD SCREEN ─────────────────────────────────────────── */
const GuildScreen = ({hunter}) => (
  <div className="screen-scroll slide-up">
    {/* Guild header */}
    <div style={{textAlign:'center', padding:'16px 0 20px', position:'relative'}}>
      <div style={{position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% 0%, rgba(168,85,247,0.08) 0%, transparent 70%)', pointerEvents:'none'}} />
      <div style={{fontSize:40, marginBottom:8}}>🏴</div>
      <div style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:26, color:'#e2e8f0', letterSpacing:'0.06em'}}>{hunter.guild.toUpperCase()}</div>
      <div style={{fontSize:11, color:'rgba(148,163,184,0.5)', marginTop:4}}>Guild Lv. 7 · {GUILD_MEMBERS.length} hunters</div>
      <div style={{display:'flex', gap:20, justifyContent:'center', marginTop:16}}>
        {[['Guild XP','24,800','rgba(168,85,247,0.8)'],['Rango','B','rgba(168,85,247,0.8)'],['Victorias','142','rgba(245,158,11,0.8)']].map(([l,v,c]) => (
          <div key={l} style={{textAlign:'center'}}>
            <div style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:20, color:c}}>{v}</div>
            <div style={{fontSize:9, color:'rgba(148,163,184,0.4)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:600, letterSpacing:'0.08em', textTransform:'uppercase'}}>{l}</div>
          </div>
        ))}
      </div>
    </div>

    {/* Members */}
    <div style={{marginBottom:10}}><SysLabel>— HUNTERS —</SysLabel></div>
    <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:20}}>
      {GUILD_MEMBERS.map((m,i) => (
        <div key={i} className="sl-card sl-card-hover" style={{display:'flex', alignItems:'center', gap:12, cursor:'default'}}>
          <div style={{width:36, height:36, borderRadius:8, background:`linear-gradient(135deg, ${RANKS_CFG[m.rank].color}20, ${RANKS_CFG[m.rank].color}08)`, border:`1px solid ${RANKS_CFG[m.rank].color}30`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:RANKS_CFG[m.rank].color, fontFamily:"'Rajdhani',sans-serif", flexShrink:0}}>
            {m.name[0]}
          </div>
          <div style={{flex:1}}>
            <div style={{display:'flex', alignItems:'center', gap:8}}>
              <span style={{fontFamily:"'Rajdhani',sans-serif", fontWeight:700, fontSize:14, color:'#e2e8f0'}}>{m.name}</span>
              {m.name === hunter.name && <span style={{fontSize:9, color:'rgba(96,165,250,0.6)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, letterSpacing:'0.08em', background:'rgba(59,130,246,0.1)', border:'1px solid rgba(59,130,246,0.2)', borderRadius:3, padding:'1px 5px'}}>YOU</span>}
            </div>
            <div style={{fontSize:10, color:'rgba(148,163,184,0.5)', marginTop:1}}>{m.role} · Lv.{m.level}</div>
          </div>
          <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:3}}>
            <RankBadge rank={m.rank} size="sm" />
            <div style={{display:'flex', alignItems:'center', gap:3}}>
              <span style={{fontSize:11, animation:'streakAnim 1.8s ease-in-out infinite', display:'inline-block'}}>🔥</span>
              <span style={{fontSize:11, color:'#f97316', fontFamily:"'Rajdhani',sans-serif", fontWeight:600}}>{m.streak}</span>
            </div>
          </div>
        </div>
      ))}
    </div>

    {/* Guild quests */}
    <div style={{marginBottom:10}}><SysLabel>— QUESTS DE GUILD —</SysLabel></div>
    <div style={{display:'flex', flexDirection:'column', gap:8}}>
      {[
        {title:'Entre todos: 500 series esta semana', prog:347, total:500, reward:2000},
        {title:'Ningún miembro falla 3 días seguidos', prog:14, total:14, reward:1500},
      ].map((q,i) => (
        <div key={i} className="quest-card">
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:8}}>
            <span style={{fontSize:12, color:'#e2e8f0', flex:1, paddingRight:8}}>{q.title}</span>
            <span style={{fontSize:10, color:'rgba(168,85,247,0.7)', fontFamily:"'Barlow Condensed',sans-serif", fontWeight:700, whiteSpace:'nowrap'}}>+{q.reward} XP</span>
          </div>
          <div className="prog-track">
            <div className="prog-fill" style={{width:`${(q.prog/q.total)*100}%`, background:'linear-gradient(90deg, #7e22ce, #a855f7)'}} />
          </div>
          <div style={{marginTop:5, fontSize:10, color:'rgba(148,163,184,0.4)'}}>{q.prog} / {q.total}</div>
        </div>
      ))}
    </div>
    <div style={{height:16}} />
  </div>
);

/* ── APP ──────────────────────────────────────────────────── */
function App() {
  const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSlider } = window;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('dashboard');
  const [showLevelUp, setShowLevelUp] = useState(false);

  const rank = tweaks.hunterRank || 'C';
  const density = tweaks.particleDensity || 40;

  useEffect(() => {
    const stop = startParticles(density);
    return stop;
  }, [density]);

  const hunter = {...HUNTER_BASE, level: HUNTER_BASE.level + (rank !== 'C' ? RANK_ORDER.indexOf(rank) - RANK_ORDER.indexOf('C') : 0)};

  return (
    <>
      {showLevelUp && <LevelUpModal newLevel={hunter.level+1} rank={rank} onClose={()=>setShowLevelUp(false)} />}

      <div className="phone">
        <TopBar hunter={hunter} rank={rank} onTriggerLevelUp={()=>setShowLevelUp(true)} />

        {screen==='dashboard' && <DashboardScreen hunter={hunter} rank={rank} onTab={setScreen} onLevelUp={()=>setShowLevelUp(true)} />}
        {screen==='status'    && <StatusScreen    hunter={hunter} rank={rank} />}
        {screen==='training'  && <TrainingScreen />}
        {screen==='quests'    && <QuestsScreen />}
        {screen==='guild'     && <GuildScreen hunter={hunter} />}

        <BottomNav active={screen} onTab={setScreen} />
      </div>

      <TweaksPanel>
        <TweakSection title="Hunter">
          <TweakRadio  id="hunterRank"      label="Rango actual"     value={tweaks.hunterRank}      options={['E','D','C','B','A','S']} onChange={v=>setTweak('hunterRank',v)} />
        </TweakSection>
        <TweakSection title="Estilo">
          <TweakRadio  id="glowIntensity"   label="Intensidad glow"  value={tweaks.glowIntensity}   options={['off','low','full']} onChange={v=>setTweak('glowIntensity',v)} />
        </TweakSection>
        <TweakSection title="Partículas">
          <TweakSlider id="particleDensity" label="Densidad"         value={tweaks.particleDensity} min={0} max={80} step={10} onChange={v=>setTweak('particleDensity',v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
