<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AusinLifting — Prototipo</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      background: oklch(0.145 0 0);
      color: oklch(0.985 0 0);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    input, textarea, button, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    textarea { resize: none; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: oklch(0.269 0 0); border-radius: 2px; }

    /* Transition helpers */
    .fade-in { animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Section collapse animation */
    .collapsible-content {
      overflow: hidden;
      transition: max-height 0.2s ease, opacity 0.2s ease;
    }
    .collapsible-content.open { max-height: 2000px; opacity: 1; }
    .collapsible-content.closed { max-height: 0; opacity: 0; }

    /* Input base */
    .inp {
      background: oklch(1 0 0 / 8%);
      border: 1px solid oklch(1 0 0 / 12%);
      border-radius: 5px;
      color: oklch(0.985 0 0);
      padding: 5px 8px;
      outline: none;
      transition: border-color 0.15s;
    }
    .inp:focus { border-color: oklch(1 0 0 / 30%); }
    .inp::placeholder { color: oklch(0.556 0 0); }

    /* Dark selects */
    select.inp {
      appearance: none;
      -webkit-appearance: none;
      background-color: oklch(0.10 0 0);
      color: oklch(0.985 0 0);
      border-color: oklch(1 0 0 / 18%);
      cursor: pointer;
    }
    select.inp option {
      background: oklch(0.10 0 0);
      color: oklch(0.985 0 0);
    }

    /* Tweaks panel */
    #tweaks-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: oklch(0.205 0 0);
      border: 1px solid oklch(1 0 0 / 15%);
      border-radius: 10px;
      padding: 16px;
      width: 220px;
      box-shadow: 0 8px 32px oklch(0 0 0 / 50%);
    }
    #tweaks-panel.visible { display: block; }
  </style>
</head>
<body>
<div id="root"></div>

<div id="tweaks-panel">
  <p style="font-size:11px;font-weight:600;letter-spacing:0.08em;color:oklch(0.708 0 0);text-transform:uppercase;margin-bottom:12px;">Tweaks</p>
  <label style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px;">
    <span style="font-size:11px;color:oklch(0.708 0 0);">Personaje del día</span>
    <select id="tweak-char" class="inp" style="font-size:12px;">
      <option value="1">Personaje 1 (Lun)</option>
      <option value="2" selected>Personaje 2 (Mar)</option>
      <option value="3">Personaje 3 (Mié)</option>
      <option value="4">Personaje 4 (Jue)</option>
      <option value="5">Personaje 5 (Vie)</option>
      <option value="6">Personaje 6 (Sáb)</option>
      <option value="7">Personaje 7 (Dom)</option>
    </select>
  </label>
  <label style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px;">
    <span style="font-size:11px;color:oklch(0.708 0 0);">Densidad</span>
    <select id="tweak-density" class="inp" style="font-size:12px;">
      <option value="compact">Compacta</option>
      <option value="normal" selected>Normal</option>
      <option value="spacious">Espaciada</option>
    </select>
  </label>
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
    <input type="checkbox" id="tweak-dots-color" />
    <span style="font-size:11px;color:oklch(0.708 0 0);">Dots de color (M/B/E/C)</span>
  </label>
</div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Tokens ────────────────────────────────────────────────────────────────
const T = {
  bg: 'oklch(0.145 0 0)',
  card: 'oklch(0.205 0 0)',
  cardHover: 'oklch(0.22 0 0)',
  border: 'oklch(1 0 0 / 10%)',
  borderHover: 'oklch(1 0 0 / 22%)',
  text: 'oklch(0.985 0 0)',
  muted: 'oklch(0.708 0 0)',
  subtle: 'oklch(0.556 0 0)',
  z800: 'oklch(0.269 0 0)',
  z700: 'oklch(0.31 0 0)',
  primary: 'oklch(0.922 0 0)',
  primaryFg: 'oklch(0.205 0 0)',
  danger: 'oklch(0.704 0.191 22.216)',
  r: '0.625rem',
};

// Section dot colors (when colorful tweaks on)
const DOT_COLORS = {
  M: { bg: 'oklch(0.55 0.14 250)', fg: 'white' }, // blue — movilidad
  B: { bg: 'oklch(0.55 0.14 140)', fg: 'white' }, // green — básicos
  E: { bg: 'oklch(0.55 0.14 50)', fg: 'white' },  // amber — entrenamiento
  C: { bg: 'oklch(0.55 0.14 20)', fg: 'white' },  // red — cardio
};

// ── Mock data ─────────────────────────────────────────────────────────────
const BLOCKS = [
  {
    id: 1, name: 'Fuerza Base', notes: 'Ciclo 12 semanas hipertrofia → fuerza',
    weeks: [
      { id: 11, weekNumber: 1, hasM: true, hasB: true, hasE: true, hasC: false, workouts: [
        { id: 101, name: 'Día A — Sentadilla + Press', createdAt: '2026-04-07' },
        { id: 102, name: 'Día B — Peso muerto + Jalones', createdAt: '2026-04-09' },
      ]},
      { id: 12, weekNumber: 2, hasM: true, hasB: true, hasE: true, hasC: true, workouts: [
        { id: 103, name: 'Día A — Sentadilla + Press', createdAt: '2026-04-14' },
        { id: 104, name: 'Día B — Peso muerto + Jalones', createdAt: '2026-04-16' },
      ]},
      { id: 13, weekNumber: 3, hasM: false, hasB: false, hasE: false, hasC: false, workouts: [] },
    ],
  },
  {
    id: 2, name: 'Prep. Competición', notes: 'Pico de fuerza pre-competición',
    weeks: [
      { id: 21, weekNumber: 1, hasM: true, hasB: false, hasE: true, hasC: false, workouts: [
        { id: 201, name: 'Sentadilla específico', createdAt: '2026-03-03' },
      ]},
      { id: 22, weekNumber: 2, hasM: true, hasB: false, hasE: true, hasC: false, workouts: [] },
      { id: 23, weekNumber: 3, hasM: false, hasB: false, hasE: false, hasC: false, workouts: [] },
      { id: 24, weekNumber: 4, hasM: false, hasB: false, hasE: false, hasC: false, workouts: [] },
    ],
  },
];

const STANDALONE = [
  { id: 301, name: 'Cardio spinning', notes: null, createdAt: '2026-04-20' },
  { id: 302, name: 'Técnica arranque', notes: 'Sin carga, solo movimiento', createdAt: '2026-04-18' },
];

const WORKOUT_DETAIL = {
  id: 101,
  name: 'Día A — Sentadilla + Press',
  notes: 'Semana 1, mantener técnica limpia',
  mobilitySession: {
    id: 1,
    exercises: [
      { id: 10, name: 'Apertura de cadera 90/90', sets: [{ id: 1, num: 1, reps: 60, notes: '' }] },
      { id: 11, name: 'Hip flexor stretch', sets: [{ id: 2, num: 1, reps: 45, notes: '' }] },
    ]
  },
  basicsSession: {
    id: 2,
    exercises: [
      { id: 20, name: 'Good morning', sets: [
        { id: 10, num: 1, kg: 60, reps: 5, rir: 3, notes: '' },
        { id: 11, num: 2, kg: 60, reps: 5, rir: 3, notes: '' },
        { id: 12, num: 3, kg: 60, reps: 5, rir: 3, notes: '' },
      ]},
      { id: 21, name: 'Facepull', sets: [
        { id: 13, num: 1, kg: 25, reps: 15, rir: 2, notes: '' },
        { id: 14, num: 2, kg: 25, reps: 15, rir: 2, notes: '' },
      ]},
    ]
  },
  mainExercises: [
    { id: 30, name: 'Sentadilla', sets: [
      { id: 20, num: 1, kg: 80, reps: 5, rir: 4, notes: 'Calentamiento', isWarmup: true },
      { id: 21, num: 2, kg: 110, reps: 5, rir: 4, notes: 'Calentamiento', isWarmup: true },
      { id: 22, num: 3, kg: 140, reps: 5, rir: 3, notes: '', isWarmup: false },
      { id: 23, num: 4, kg: 140, reps: 5, rir: 3, notes: '', isWarmup: false },
      { id: 24, num: 5, kg: 140, reps: 4, rir: 2, notes: 'Bajó un poco la barra', isWarmup: false },
    ]},
    { id: 31, name: 'Press banca', sets: [
      { id: 30, num: 1, kg: 60, reps: 5, rir: 4, notes: 'Calentamiento', isWarmup: true },
      { id: 31, num: 2, kg: 80, reps: 5, rir: 4, notes: 'Calentamiento', isWarmup: true },
      { id: 32, num: 3, kg: 100, reps: 5, rir: 3, notes: '', isWarmup: false },
      { id: 33, num: 4, kg: 100, reps: 5, rir: 3, notes: '', isWarmup: false },
    ]},
    { id: 32, name: 'RDL', sets: [
      { id: 40, num: 1, kg: 100, reps: 8, rir: 3, notes: '', isWarmup: false },
      { id: 41, num: 2, kg: 100, reps: 8, rir: 2, notes: '', isWarmup: false },
      { id: 42, num: 3, kg: 100, reps: 7, rir: 2, notes: '', isWarmup: false },
    ]},
  ],
  cardioSession: null,
};

// ── Shared UI primitives ───────────────────────────────────────────────────
const BtnPrimary = ({ children, onClick, style }) => (
  <button onClick={onClick} style={{
    background: T.primary, color: T.primaryFg,
    border: 'none', borderRadius: T.r,
    padding: '7px 14px', fontSize: 13, fontWeight: 500,
    cursor: 'pointer', transition: 'opacity 0.15s', ...style
  }}
  onMouseEnter={e => e.currentTarget.style.opacity='0.85'}
  onMouseLeave={e => e.currentTarget.style.opacity='1'}
  >{children}</button>
);

const BtnGhost = ({ children, onClick, style }) => (
  <button onClick={onClick} style={{
    background: 'none', color: T.text,
    border: `1px solid oklch(1 0 0 / 18%)`,
    borderRadius: T.r, padding: '7px 14px',
    fontSize: 13, fontWeight: 500, cursor: 'pointer',
    transition: 'background 0.15s, border-color 0.15s', ...style
  }}
  onMouseEnter={e => { e.currentTarget.style.background=T.z800; e.currentTarget.style.borderColor='oklch(1 0 0 / 28%)'; }}
  onMouseLeave={e => { e.currentTarget.style.background='none'; e.currentTarget.style.borderColor='oklch(1 0 0 / 18%)'; }}
  >{children}</button>
);

const BtnDanger = ({ children, onClick }) => (
  <button onClick={onClick} style={{
    background: 'none', color: T.subtle, border: 'none',
    fontSize: 11, cursor: 'pointer', transition: 'color 0.15s'
  }}
  onMouseEnter={e => e.currentTarget.style.color=T.danger}
  onMouseLeave={e => e.currentTarget.style.color=T.subtle}
  >{children}</button>
);

const Label = ({ children }) => (
  <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.07em', color: T.muted, textTransform: 'uppercase' }}>
    {children}
  </span>
);

const Inp = ({ style, ...props }) => (
  <input className="inp" style={{ fontSize: 12, ...style }} {...props} />
);

// Section dot component
const SectionDot = ({ label, active, colorful }) => {
  const color = DOT_COLORS[label];
  let bg, fg;
  if (active && colorful) { bg = color.bg; fg = color.fg; }
  else if (active) { bg = T.primary; fg = T.primaryFg; }
  else { bg = T.z800; fg = T.subtle; }
  return (
    <span title={{ M:'Movilidad', B:'Básicos', E:'Entrenamiento', C:'Cardio' }[label]} style={{
      width: 22, height: 22, borderRadius: '50%',
      background: bg, color: fg,
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      fontSize: 10, fontWeight: 600, flexShrink: 0,
    }}>{label}</span>
  );
};

// ── Navbar ────────────────────────────────────────────────────────────────
const Navbar = ({ nav, setNav }) => (
  <header style={{
    height: 48, borderBottom: `1px solid ${T.border}`,
    display: 'flex', alignItems: 'center',
    padding: '0 20px', gap: 24, flexShrink: 0,
    background: T.bg,
  }}>
    <button onClick={() => setNav({ page: 'dashboard' })} style={{
      background: 'none', border: 'none', cursor: 'pointer',
      display: 'flex', alignItems: 'center', gap: 8,
    }}>
      <img src="refs/icon.png" alt="AusinLifting" style={{ width: 28, height: 28, borderRadius: 6, objectFit: 'cover' }} />
      <span style={{ fontSize: 13, fontWeight: 600, color: T.text, letterSpacing: '-0.01em' }}>AusinLifting</span>
    </button>
    <nav style={{ display: 'flex', gap: 2, flex: 1 }}>
      {[['dashboard','Dashboard'],['blocks','Bloques']].map(([p, label]) => {
        const active = nav.page === p || (p === 'blocks' && nav.page === 'blockDetail');
        return (
          <button key={p} onClick={() => setNav({ page: p })} style={{
            background: active ? T.z800 : 'none',
            color: active ? T.text : T.muted,
            border: 'none', borderRadius: T.r,
            padding: '4px 10px', fontSize: 12,
            cursor: 'pointer', fontWeight: active ? 500 : 400,
            transition: 'all 0.15s',
          }}>{label}</button>
        );
      })}
    </nav>
    <div style={{
      width: 28, height: 28, borderRadius: '50%',
      background: 'oklch(0.5 0.15 264)', display: 'flex',
      alignItems: 'center', justifyContent: 'center',
      fontSize: 11, fontWeight: 600, color: 'white', flexShrink: 0,
    }}>D</div>
  </header>
);

// ── Back link ─────────────────────────────────────────────────────────────
const Back = ({ label, onClick }) => (
  <button onClick={onClick} style={{
    background: 'none', border: 'none', cursor: 'pointer',
    color: T.muted, fontSize: 12, display: 'flex', alignItems: 'center', gap: 4,
    transition: 'color 0.15s', padding: 0,
  }}
  onMouseEnter={e => e.currentTarget.style.color=T.text}
  onMouseLeave={e => e.currentTarget.style.color=T.muted}
  >← {label}</button>
);

// ── Dashboard page ────────────────────────────────────────────────────────
const DashboardPage = ({ setNav, charNum, density }) => {
  const gap = density === 'compact' ? 6 : density === 'spacious' ? 14 : 10;
  const pad = density === 'compact' ? '10px 14px' : density === 'spacious' ? '16px 18px' : '12px 16px';

  const BlockRow = ({ block }) => {
    const [hov, setHov] = useState(false);
    return (
      <li>
        <button onClick={() => setNav({ page: 'blockDetail', blockId: block.id })} style={{
          width: '100%', background: hov ? T.cardHover : 'none',
          border: `1px solid ${hov ? T.borderHover : T.border}`,
          borderRadius: T.r, padding: pad, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          gap: 12, transition: 'border-color 0.15s, background 0.15s',
        }} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>
          <div style={{ textAlign: 'left' }}>
            <p style={{ fontWeight: 500, color: T.text, fontSize: 13 }}>{block.name}</p>
            {block.notes && <p style={{ color: T.muted, fontSize: 12, marginTop: 2 }}>{block.notes}</p>}
          </div>
          <span style={{ color: T.subtle, fontSize: 12, flexShrink: 0 }}>
            {block.weeks.length} {block.weeks.length === 1 ? 'semana' : 'semanas'}
          </span>
        </button>
      </li>
    );
  };

  const WorkoutRow = ({ w }) => {
    const [hov, setHov] = useState(false);
    return (
      <li>
        <button onClick={() => setNav({ page: 'workoutDetail', workoutId: w.id })} style={{
          width: '100%', background: hov ? T.cardHover : 'none',
          border: `1px solid ${hov ? T.borderHover : T.border}`,
          borderRadius: T.r, padding: pad, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          gap: 12, transition: 'border-color 0.15s, background 0.15s',
        }} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>
          <div style={{ textAlign: 'left' }}>
            <p style={{ fontWeight: 500, color: T.text, fontSize: 13 }}>{w.name ?? 'Entreno sin nombre'}</p>
            {w.notes && <p style={{ color: T.muted, fontSize: 12, marginTop: 2 }}>{w.notes}</p>}
          </div>
          <span style={{ color: T.subtle, fontSize: 11, flexShrink: 0 }}>
            {new Date(w.createdAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}
          </span>
        </button>
      </li>
    );
  };

  return (
    <div style={{ display: 'flex', flex: 1, overflow: 'hidden', position: 'relative' }}>
      {/* Character — full-height background, left side */}
      <div style={{
        position: 'absolute', left: 0, bottom: 0, top: 0,
        width: '46%', pointerEvents: 'none', zIndex: 0,
        display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
        overflow: 'hidden',
      }}>
        <img
          src={`refs/chars/${charNum}.png`}
          alt="Personaje"
          style={{
            maxHeight: '88%', maxWidth: '80%',
            width: 'auto', height: 'auto',
            objectFit: 'contain', objectPosition: 'bottom',
            userSelect: 'none', display: 'block', flexShrink: 0,
            mixBlendMode: 'darken',
          }}
          draggable={false}
        />
        {/* Gradient overlays — fade all edges into dark bg */}
        <div style={{
          position: 'absolute', inset: 0,
          background: [
            'linear-gradient(to right, oklch(0.145 0 0 / 5%) 0%, oklch(0.145 0 0 / 50%) 60%, oklch(0.145 0 0) 88%)',
            'linear-gradient(to bottom, oklch(0.145 0 0) 0%, transparent 12%, transparent 80%, oklch(0.145 0 0) 100%)',
            'radial-gradient(ellipse at 50% 50%, transparent 35%, oklch(0.145 0 0 / 60%) 100%)',
          ].join(', '),
        }} />
      </div>

      {/* Spacer matching character width */}
      <div style={{ width: '44%', flexShrink: 0 }} />

      {/* Content — centered in right portion */}
      <div style={{
        flex: 1, overflow: 'auto', padding: '32px 40px 32px 24px',
        position: 'relative', zIndex: 1,
        display: 'flex', flexDirection: 'column', alignItems: 'flex-start',
      }}>
      <div style={{ width: '100%', maxWidth: 480 }}>
        <div className="fade-in">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
            <h1 style={{ fontSize: 22, fontWeight: 600, letterSpacing: '-0.02em' }}>Dashboard</h1>
          </div>

          {/* CTAs */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 32 }}>
            <BtnPrimary onClick={() => setNav({ page: 'newBlock' })}>Crear bloque</BtnPrimary>
            <BtnGhost onClick={() => setNav({ page: 'newWorkout' })}>Crear entreno</BtnGhost>
          </div>

          {/* Blocks */}
          <section style={{ marginBottom: 28 }}>
            <Label>Bloques</Label>
            <ul style={{ display: 'flex', flexDirection: 'column', gap, marginTop: 10 }}>
              {BLOCKS.map(b => <BlockRow key={b.id} block={b} />)}
            </ul>
          </section>

          {/* Standalone */}
          <section>
            <Label>Entrenos sueltos</Label>
            <ul style={{ display: 'flex', flexDirection: 'column', gap, marginTop: 10 }}>
              {STANDALONE.map(w => <WorkoutRow key={w.id} w={w} />)}
            </ul>
          </section>
        </div>
      </div>
      </div>
    </div>
  );
};

// ── Block detail page ─────────────────────────────────────────────────────
const BlockDetailPage = ({ blockId, setNav, colorfulDots, density }) => {
  const block = BLOCKS.find(b => b.id === blockId) || BLOCKS[0];
  const [expanded, setExpanded] = useState({});
  const gap = density === 'compact' ? 6 : density === 'spacious' ? 14 : 10;

  const toggle = (id) => setExpanded(prev => ({ ...prev, [id]: !prev[id] }));

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: '28px 28px', maxWidth: 680 }}>
      <div className="fade-in">
        <Back label="Dashboard" onClick={() => setNav({ page: 'dashboard' })} />

        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginTop: 16, marginBottom: 24, gap: 16 }}>
          <div>
            <h1 style={{ fontSize: 22, fontWeight: 600, letterSpacing: '-0.02em' }}>{block.name}</h1>
            {block.notes && <p style={{ color: T.muted, fontSize: 13, marginTop: 4 }}>{block.notes}</p>}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexShrink: 0 }}>
            <BtnPrimary>Guardar bloque</BtnPrimary>
            <BtnDanger>Eliminar</BtnDanger>
          </div>
        </div>

        <div style={{ marginBottom: 20 }}>
          <BtnGhost>+ Añadir semana</BtnGhost>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap }}>
          {block.weeks.map(week => {
            const open = !!expanded[week.id];
            return (
              <div key={week.id} style={{
                border: `1px solid ${open ? T.borderHover : T.border}`,
                borderRadius: T.r, overflow: 'hidden',
                transition: 'border-color 0.15s',
              }}>
                {/* Week header */}
                <div style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  padding: '10px 14px', gap: 12,
                }}>
                  <button onClick={() => toggle(week.id)} style={{
                    flex: 1, display: 'flex', alignItems: 'center', gap: 10,
                    background: 'none', border: 'none', cursor: 'pointer', textAlign: 'left',
                    color: T.text,
                  }}>

// ── Workout Detail ────────────────────────────────────────────────────────
const WorkoutDetailPage = ({ workoutId, setNav }) => {
  const workout = WORKOUT_DETAIL; // use mock regardless of id
  const [sections, setSections] = useState({ mobility: true, basics: true, main: true, cardio: true });
  const [setData, setSetData] = useState(() => {
    // flatten all sets from mock into a keyed map
    const map = {};
    workout.mainExercises.forEach(ex => ex.sets.forEach(s => { map[`main_${s.id}`] = { kg: s.kg, reps: s.reps, rir: s.rir, notes: s.notes }; }));
    workout.basicsSession.exercises.forEach(ex => ex.sets.forEach(s => { map[`basics_${s.id}`] = { kg: s.kg, reps: s.reps, rir: s.rir, notes: s.notes }; }));
    workout.mobilitySession.exercises.forEach(ex => ex.sets.forEach(s => { map[`mob_${s.id}`] = { reps: s.reps, notes: s.notes }; }));
    return map;
  });
  const [saved, setSaved] = useState(false);

  const toggleSection = (key) => setSections(prev => ({ ...prev, [key]: !prev[key] }));

  const SectionHeader = ({ title, sectionKey, children }) => (
    <div style={{ border: `1px solid ${T.border}`, borderRadius: T.r, overflow: 'hidden' }}>
      <button onClick={() => toggleSection(sectionKey)} style={{
        width: '100%', background: 'none', border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '10px 14px', color: T.text,
      }}>
        <span style={{ fontWeight: 600, fontSize: 13 }}>{title}</span>
        <span style={{ color: T.subtle, fontSize: 10, transition: 'transform 0.2s', display: 'inline-block', transform: sections[sectionKey] ? 'rotate(0)' : 'rotate(-90deg)' }}>▼</span>
      </button>
      <div className={`collapsible-content ${sections[sectionKey] ? 'open' : 'closed'}`}>
        <div style={{ borderTop: `1px solid ${T.border}`, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 16 }}>
          {children}

    </div>

  const MobilitySetRow = ({ set, prefix }) => {
    const key = `${prefix}_${set.id}`;
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>

        <Inp type="text" style={{ flex: 1, minWidth: 60 }}

        <Inp type="number" style={{ width: 52 }}
          value={setData[key]?.reps ?? set.reps}

        />

        <Inp type="number" style={{ width: 44 }}

          onChange={e => setSetData(prev => ({ ...prev, [key]: { ...prev[key], rir: e.target.value }}))}

          value={setData[key]?.notes ?? set.notes}

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: '28px 28px', maxWidth: 680 }}>
      <div className="fade-in">
        <Back label="Dashboard" onClick={() => setNav({ page: 'dashboard' })} />

        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginTop: 16, marginBottom: 6, gap: 16 }}>
          <h1 style={{ fontSize: 22, fontWeight: 600, letterSpacing: '-0.02em' }}>{workout.name}</h1>
          <BtnDanger>Eliminar</BtnDanger>
        </div>
        {workout.notes && <p style={{ color: T.muted, fontSize: 13, marginBottom: 20 }}>{workout.notes}</p>}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 20 }}>
          {/* Movilidad */}
          <SectionHeader title="Movilidad" sectionKey="mobility">

              <ExerciseBlock key={ex.id} ex={ex} type="mobility" />
            ))}

          </SectionHeader>

          {/* Básicos */}
          <SectionHeader title="Básicos" sectionKey="basics">
            {workout.basicsSession.exercises.map(ex => (

          {/* Entrenamiento */}

  );

// ── App ────────────────────────────────────────────────────────────────────
const App = () => {
  const [nav, setNavRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem('al_nav') || '{}'); } catch { return {}; }
  });
  const [tweaks, setTweaks] = useState({
    charNum: new Date().getDay() === 0 ? 7 : new Date().getDay(),
    density: 'normal',
    colorfulDots: false,
  });

  const setNav = useCallback((n) => {
    setNavRaw(n);
    try { localStorage.setItem('al_nav', JSON.stringify(n)); } catch {}
  }, []);

  // Tweaks panel DOM bridge
  useEffect(() => {
    const charSel = document.getElementById('tweak-char');
    const denSel = document.getElementById('tweak-density');
    const dotsCb = document.getElementById('tweak-dots-color');
    if (charSel) charSel.value = tweaks.charNum;
    if (denSel) denSel.value = tweaks.density;
    if (dotsCb) dotsCb.checked = tweaks.colorfulDots;

    const onChar = (e) => setTweaks(prev => ({ ...prev, charNum: Number(e.target.value) }));
    const onDen = (e) => setTweaks(prev => ({ ...prev, density: e.target.value }));
    const onDots = (e) => setTweaks(prev => ({ ...prev, colorfulDots: e.target.checked }));

    charSel?.addEventListener('change', onChar);
    denSel?.addEventListener('change', onDen);
    dotsCb?.addEventListener('change', onDots);
    return () => {
      charSel?.removeEventListener('change', onChar);
      denSel?.removeEventListener('change', onDen);
      dotsCb?.removeEventListener('change', onDots);
    };
  }, []);

  // Tweaks host integration
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel')?.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel')?.classList.remove('visible');
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const page = nav.page || 'dashboard';

  const renderPage = () => {
    switch (page) {
      case 'dashboard': return <DashboardPage setNav={setNav} charNum={tweaks.charNum} density={tweaks.density} />;
      case 'blockDetail': return <BlockDetailPage blockId={nav.blockId || 1} setNav={setNav} colorfulDots={tweaks.colorfulDots} density={tweaks.density} />;
      case 'workoutDetail': return <WorkoutDetailPage workoutId={nav.workoutId} setNav={setNav} />;
      case 'newWorkout': return <NewWorkoutPage setNav={setNav} />;
      case 'newBlock': return <NewBlockPage setNav={setNav} />;
      default: return <DashboardPage setNav={setNav} charNum={tweaks.charNum} density={tweaks.density} />;
    }
  };

  return (
    <>
      <Navbar nav={nav} setNav={setNav} />
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex' }}>
        {renderPage()}
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
